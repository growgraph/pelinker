fail_fast: false
# Generated by uv; formatting it makes every `uv lock` and Dependabot PR fail.
exclude: ^uv\.lock$

repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-toml
    -   id: check-merge-conflict
    -   id: pretty-format-json
        args: [--autofix, --indent, '4', --no-sort-keys]

-   repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
    -   id: pretty-format-yaml
        args: [--autofix, --indent, '4', --preserve-quotes]

  # The only TOML formatter: a second one disagrees on layout and the two never converge.
  # tomlkit renders the output, so it is pinned to keep local and CI byte-identical.
-   repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
    -   id: toml-sort
        args: [--in-place, --all]
        additional_dependencies: [tomlkit==0.15.1]
