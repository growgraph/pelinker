name: test

on:
    pull_request:
    push:
        branches: [main]

jobs:
    pytest:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
        -   uses: actions/checkout@v5
        -   name: Install uv
            uses: astral-sh/setup-uv@v7
            with:
                version: "0.10.12"
                enable-cache: true

        # The dev extra pins en_core_web_lg, so the tests covering tokenization, span
        # mapping and the HF embedding path actually run here. They skip themselves when
        # the model is absent, which is how a removed transformers API once reached main.
        -   name: Install dependencies (including dev)
            run: uv sync --extra dev

        -   name: Cache Hugging Face weights
            uses: actions/cache@v4
            with:
                path: ~/.cache/huggingface
                key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
                restore-keys: hf-${{ runner.os }}-

        -   name: Run tests
            run: uv run pytest test
