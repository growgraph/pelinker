[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{email = "abelikov@gmail.com", name = "Alexander Belikov"}]
dependencies = [
  "click>=8.1,<9",
  "dataclass-wizard>=0.35.1",
  "fastapi>=0.115.0,<1",
  "hdbscan>=0.8.41",
  "hydra-core>=1.3.2",
  "joblib>=1.4.2,<2",
  "matplotlib>=3.9",
  "pandas>=2.3.3",
  "plotly>=6.2.0,<7",
  "pyarrow>=23.0.1",
  "pysankey>=0.0.1",
  "rich>=14.1.0",
  "scikit-learn>=1.5.0,<2",
  "scikit-optimize>=0.10.2",
  "seaborn>=0.13.2,<0.14",
  "sentence-transformers>=5.6,<6",
  "spacy>=3.7.5,<4",
  "tf-keras>=2.16.0",
  "torch>=2.13.0",
  "transformers>=5.5.0,<6",
  "umap-learn[parametric-umap]>=0.5.11",
  "uvicorn>=0.42.0",
  "wordfreq>=3.1.1"
]
description = "bio / sci property entity linker"
name = "pelinker"
readme = "README.md"
requires-python = ">=3.10.6"
version = "0.2.0"

[project.optional-dependencies]
dev = [
  # Pinned as a real dependency rather than left to `spacy download`: any `uv sync`
  # prunes a downloaded model, which silently re-skips every test that needs it.
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
  "pre-commit>=4.0.1,<5",
  "pytest>=9.0.2",
  "ty>=0.0.1a10"
]
docs = [
  "griffe<2.0.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-glightbox>=0.4.0",
  "mkdocs-jupyter>=0.25.1",
  "mkdocs-literate-nav>=0.6.2",
  "mkdocs-material>=9.6.14",
  "mkdocs>=1.6.1",
  "mkdocstrings-python>=2.0.3",
  "mkdocstrings[python]>=0.29.1"
]
eval = [
  # LLM-assisted gold pre-annotation (run/eval/annotate_llm.py); the linker itself
  # never calls an LLM.
  "anthropic>=1.0"
]
gpu = [
  "cupy-cuda12x>=13.6.0"
]
preprocess = [
  # KB regeneration only (run/preprocessing/extract_properties_*.py); the linker never
  # parses ontologies at fit or serve time.
  "rdflib>=7.0"
]

[project.scripts]
pelinker-dim-selection = "pelinker.cli.dim_selection:main"
pelinker-fit = "pelinker.cli.fit:run"
pelinker-link-files = "pelinker.cli.link_files:main"
pelinker-model-selection = "pelinker.cli.model_selection:main"
pelinker-replot = "pelinker.cli.replot:main"
pelinker-scale-curve = "pelinker.cli.scale_curve:main"
pelinker-serves = "pelinker.cli.server:run"

[tool.hatch.build.targets.sdist]
include = ["pelinker"]

[tool.hatch.build.targets.wheel]
include = ["pelinker"]

[tool.hatch.metadata]
# the pinned en_core_web_lg wheel in the `dev` extra is a direct URL reference
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "heavy: needs large out-of-band assets (spaCy en_core_web_lg, HF weights); skipped automatically when absent"
]
testpaths = ["test"]

[tool.ruff.lint]
# The pre-commit defaults were not reporting unused imports, which is how ~100 of them
# accumulated. F401 is the point of this block; the rest is ruff's default set.
ignore = ["E722"]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
